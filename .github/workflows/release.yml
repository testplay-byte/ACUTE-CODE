name: Release

# ROUND-45 (packaging v1): assembles the launcher kit — the owner-facing
# distribution artifact — and opens a DRAFT GitHub release for it. The kit is
# pure scripts (no build): ACUTE.bat + acute.sh + acute_launcher.py +
# launcher README + CHANGELOG + VERSION. (R87: credentials.example.txt is
# GONE from the kit — the launcher takes the GitHub token interactively once
# or from ACUTE_GITHUB_PAT; provider keys are saved in-app only.)
#
# ROUND-51 (R51-a): `desktop-installer` builds the real thing — the Windows
# NSIS installer with the bundled sidecar (pinned node.exe + the staged
# agent-core tree, ADR-0009). The launcher's desktop flow downloads this
# installer from the GitHub release and installs/launches it, which is how
# the native embedded browser (R50) finally reaches the owner: the dev-mode
# browser flow always ran in the SYSTEM browser where the native child
# webviews never activate.
#
# ROUND-100 (R100-B): `linux-bundles` — the Linux release (deb + AppImage,
# research docs/research/browser-engine-and-linux-round-100.md §C). A
# SIBLING of desktop-installer (they share nothing but checkout): same
# sidecar staging contract (ADR-0009, `--platform linux-x64`), same pinned
# Node runtime, same pre-pack boot gate (the R57 discipline, ported to
# bash) — only the bundler targets differ (`--bundles` overrides
# tauri.conf.json's ["nsis"] per invocation, so no conf-file split).
#
# ROUND-101 (R101-E): `linux-bundles-arm64` — the aarch64 twin of the
# above (the owner asked for ARM64 IN ADDITION to x64; v0.98.0 shipped
# amd64 only). Runs on GitHub's NATIVE ARM64 runner (ubuntu-24.04-arm),
# NOT a cross-compile: node-pty ships prebuilds only for darwin/win32, so
# on Linux it compiles from source for the HOST arch — an x64 runner with
# `--target aarch64` would link an x86_64 pty.node into an arm64 bundle.
# Natively, the x64 job's whole recipe runs unmodified (no --target flag,
# no qemu). COST: the repo is private, so ARM runner minutes are billed —
# acceptable because this workflow fires only on manual dispatch and v*
# tags (never per-push), bounding the cost to releases. rust-checks.yml's
# `rust-linux-arm64` leg carries the per-push compile gate instead
# (ROUND-122: extracted from ci.yml, path-gated on src-tauri/**).
#
# Triggers (same for all jobs):
#   - workflow_dispatch (optionally with a `version` input — when set, it must
#     match the repo's version, guarding "tagged but forgot to bump" mistakes)
#     → ALL jobs build (artifacts on every dispatch; the draft release only
#     happens on tags)
#   - push of a v* tag (the release path: kit + installer + Linux bundles
#     x64 AND ARM64 + draft release)
#
# The draft release is tag-only by design: an untagged dispatch still produces
# the installer + Linux-bundle ARTIFACTS (CI-verifiable), just no release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version (optional; must match the repo when set, e.g. 0.45.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  launcher-kit:
    runs-on: ubuntu-latest
    # ROUND-103: every job in this workflow is bounded — a wedged job
    # fails visibly in minutes instead of hanging for hours (the v0.100.0
    # incident: a 27-minute silent stall that needed manual cancellation).
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@11.22.0) — same
      # setup as ci.yml, minus the Rust toolchain (the kit builds nothing).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Quality gate (same bar as CI, minus build + e2e: those need a built
      # stack and the kit ships no binaries — `pnpm test` runs the full unit
      # suite across all workspaces; the e2e file skips itself without a
      # built dist).
      - name: Quality gate (lint, typecheck, test)
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Version consistency
        run: node scripts/release/version.mjs check

      # R74 + R90-B1: the launcher's unit tests — the kit ships the launcher
      # itself, so its regression tests gate the artifact it goes into (and,
      # via github-release's needs: [launcher-kit, …], every tag). Discovery
      # runs every launcher/tests/test_*.py file: the R74 release-picker
      # freeze and the R90-B1 GitHub-token path/migration contract.
      - name: Launcher unit tests
        run: python3 -m unittest discover -s launcher/tests -v

      - name: Resolve version
        id: version
        run: |
          repo_version="$(node scripts/release/version.mjs get)"
          if [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" != "$repo_version" ]; then
            echo "::error::dispatch version '${{ inputs.version }}' does not match the repo version '$repo_version' — run 'pnpm version:set ${{ inputs.version }}' and commit first"
            exit 1
          fi
          echo "version=$repo_version" >> "$GITHUB_OUTPUT"

      - name: Assemble launcher kit
        run: |
          version="${{ steps.version.outputs.version }}"
          kit="release/acute-launcher-kit-v${version}"
          mkdir -p "$kit"
          cp launcher/ACUTE.bat "$kit/"
          cp launcher/acute.sh "$kit/"
          cp launcher/acute_launcher.py "$kit/"
          cp launcher/README.md "$kit/README.md"
          cp CHANGELOG.md "$kit/"
          printf '%s\n' "$version" > "$kit/VERSION"
          (cd "$kit" && zip -qr "../acute-launcher-kit-v${version}.zip" .)
          unzip -l "release/acute-launcher-kit-v${version}.zip"

      # Round-11 lesson (docs/runbooks/LOCAL-PC-RUNNER.md): a .bat with LF
      # endings disintegrates in cmd.exe. ACUTE.bat is committed with CRLF and
      # must survive checkout + copy + zip byte-for-byte — the check runs on
      # BOTH the kit folder copy and the bytes actually inside the zip.
      - name: Verify ACUTE.bat kept CRLF line endings
        run: |
          version="${{ steps.version.outputs.version }}"
          bat="release/acute-launcher-kit-v${version}/ACUTE.bat"
          zip="release/acute-launcher-kit-v${version}.zip"
          file "$bat"
          file "$bat" | grep -q "CRLF" || {
            echo "::error::$bat lost its CRLF line endings — cmd.exe cannot run an LF .bat (round-11 lesson). Fix the file in launcher/ and re-run."
            exit 1
          }
          unzip -p "$zip" ACUTE.bat | file -
          unzip -p "$zip" ACUTE.bat | file - | grep -q "CRLF" || {
            echo "::error::ACUTE.bat inside $zip lost its CRLF line endings."
            exit 1
          }

      - name: Upload launcher kit artifact
        uses: actions/upload-artifact@v4
        with:
          name: acute-launcher-kit-v${{ steps.version.outputs.version }}
          path: release/acute-launcher-kit-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  # ROUND-51 (R51-a): the Windows desktop installer. Mirrors ci.yml's toolchain
  # (pnpm → node → rust) so the Rust gate is the same compiler, then stages the
  # ADR-0009 sidecar bundle and lets `tauri build` run beforeBuildCommand
  # (`pnpm build`) itself — one canonical build path, no divergent CI scripts.
  desktop-installer:
    runs-on: windows-latest
    # ROUND-100 (R100-A): back to 30 — the fixedRuntime bundle is gone
    # (the evergreen bootstrapper restored; the installer is ~37–40 MB again).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # PINNED on purpose (not a floating "24"): the CI tests the app on this
      # exact runtime AND the bundle below ships this exact node.exe — drift
      # between the tested runtime and the shipped one is invisible otherwise.
      # Bump deliberately, together with SIDECAR_NODE_VERSION.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm version:check

      # The workspace build must run BEFORE staging (stage-sidecar.mjs copies
      # agent-core/dist + shared/dist). `pnpm tauri build` below re-runs
      # `pnpm build` via beforeBuildCommand — idempotent, same commit, same
      # output; keeping it is the price of one canonical build command.
      - name: Build the workspace (shared + agent-core + vite)
        run: pnpm build

      # ADR-0009 sidecar staging: pruned node_modules (win32-x64 prebuilds
      # only), exact lockfile versions, vendored `shared` with a runnable
      # package.json. See scripts/release/stage-sidecar.mjs for why pnpm
      # deploy was rejected (it ships a 202 MB non-running tree).
      - name: Stage the sidecar bundle
        run: node scripts/release/stage-sidecar.mjs --platform win32-x64

      # The pinned Node runtime (MIT) beside the staged app + its license
      # texts for the bundle's LICENSES/ dir (SPEC §6 / ADR-0009: the license
      # audit's allowed-list is about npm deps; the RUNTIME's compliance
      # vehicle is shipping its notices inside the installer).
      - name: Bundle the pinned Node runtime + licenses
        shell: pwsh
        env:
          # Must match setup-node above — the shipped runtime IS the tested one.
          SIDECAR_NODE_VERSION: 24.20.0
        run: |
          $ver = $env:SIDECAR_NODE_VERSION
          # ${ver} braces: `$ver-win-x64` would still parse, but the braces
          # make the interpolation unambiguous (and greppable).
          $zip = "${env:TEMP}\node-v${ver}-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${ver}/node-v${ver}-win-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "${env:TEMP}\node-extract" -Force
          $extract = "${env:TEMP}\node-extract\node-v${ver}-win-x64"
          $sidecar = "src-tauri/staging/sidecar"
          Copy-Item "$extract\node.exe" -Destination "$sidecar/node.exe"
          # v24 ships one combined LICENSE (older releases split a separate
          # ThirdPartyNotices.md — copy it too when present, future-proof).
          New-Item -ItemType Directory -Force -Path "$sidecar/LICENSES" | Out-Null
          Copy-Item "$extract\LICENSE" -Destination "$sidecar/LICENSES/node-v${ver}-LICENSE.txt"
          if (Test-Path "$extract\ThirdPartyNotices.md") {
            Copy-Item "$extract\ThirdPartyNotices.md" -Destination "$sidecar/LICENSES/node-v${ver}-ThirdPartyNotices.md"
          }
          Get-ChildItem "$sidecar" | Select-Object Name
          if (-not (Test-Path "$sidecar/node.exe")) { throw "node.exe was not staged" }

      # ROUND-57 — THE WINDOWS PRE-PACK BOOT GATE: the staged engine must
      # actually BOOT on Windows before it is packed into the installer. The
      # R51 "proven bootable" check ran on Linux only, which is exactly how the
      # default pnpm link farm (189 junctions on this very runner) shipped:
      # Linux preserves links, tauri-bundler + NSIS pack/extract on the owner's
      # disk did not, and the installed engine died with ERR_MODULE_NOT_FOUND
      # before its first log line (owner's 0.56.0 session). This gate runs the
      # REAL pinned node.exe against the staged app with the same env the Rust
      # shell passes (ACUTE_TOKEN / ACUTE_DB_PATH, cwd = the app dir) and polls
      # for the ACUTE_READY handshake line — the exact first failure the owner
      # saw. A failed boot prints the engine's stdout/stderr tails and fails
      # the build BEFORE `pnpm tauri build` can pack a dead engine.
      - name: Boot the staged engine on Windows (pre-pack gate)
        shell: pwsh
        env:
          ACUTE_BOOT_TIMEOUT_S: "90"
        run: |
          # ALL paths ABSOLUTE (round-57, two caught gate bugs): Start-Process
          # resolves a RELATIVE -ArgumentList against the CHILD's
          # -WorkingDirectory, not pwsh's cwd — run 1 passed "app\dist\main.js"
          # → <wd>\app\dist\main.js (doubled app); run 2 passed a repo-relative
          # path → the whole working dir prefixed onto it. The engine never
          # ran either time; the gate refused to pack, exactly as designed.
          $sidecar = Join-Path $PWD "src-tauri\staging\sidecar"
          $out = "$env:TEMP\acute-boot-stdout.log"
          $err = "$env:TEMP\acute-boot-stderr.log"
          $db  = "$env:TEMP\acute-boot-test.db"
          Remove-Item $out, $err, $db -Force -ErrorAction SilentlyContinue
          $env:ACUTE_TOKEN = "ci-boot-token"
          $env:ACUTE_DB_PATH = $db
          $job = Start-Process -FilePath (Join-Path $sidecar "node.exe") `
            -ArgumentList (Join-Path $sidecar "app\dist\main.js") `
            -WorkingDirectory (Join-Path $sidecar "app") `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $deadline = (Get-Date).AddSeconds([int]$env:ACUTE_BOOT_TIMEOUT_S)
          $ready = $false
          try {
            while ((Get-Date) -lt $deadline) {
              if ($job.HasExited) { break }
              if ((Test-Path $out) -and (Select-String -Path $out -Pattern "ACUTE_READY" -Quiet -ErrorAction SilentlyContinue)) {
                $ready = $true; break
              }
              Start-Sleep -Milliseconds 500
            }
            if ($ready) {
              $line = (Select-String -Path $out -Pattern "ACUTE_READY").Line
              Write-Host "R57 boot gate: staged engine is UP on Windows — $line"
            } else {
              Write-Host "::error::R57 boot gate: staged engine did not report ACUTE_READY within $($env:ACUTE_BOOT_TIMEOUT_S)s (exit=$($job.ExitCode)). NEVER pack this tree — this is the owner's 'Can't reach agent-core' failure mode."
              if (Test-Path $out) { Write-Host "--- engine stdout tail ---"; Get-Content $out -Tail 40 | ForEach-Object { Write-Host $_ } }
              if (Test-Path $err) { Write-Host "--- engine stderr tail ---"; Get-Content $err -Tail 40 | ForEach-Object { Write-Host $_ } }
              exit 1
            }
          } finally {
            # Tree-kill: the engine may hold sqlite + children (terminal shells
            # are only created on demand, but be thorough — a leaked node.exe
            # would hold the temp DB and slow every later retry). Guard on
            # HasExited so an already-dead engine doesn't print "process not
            # found" noise over the real diagnostics.
            if (-not $job.HasExited) {
              & taskkill /T /F /PID $job.Id | Out-Null
            }
          }

      # NSIS (+ WiX tooling) downloads automatically on first use — no admin
      # needed. currentUser install mode → no UAC prompt on the owner's PC.
      - name: Build the NSIS installer
        run: pnpm tauri build

      # Bundler contract (tauri-bundler 2.11.5 nsis/mod.rs): the file is
      # <productName>_<version>_<arch>-setup.exe → ACUTE-CODE_<v>_x64-setup.exe.
      - name: Verify + collect the installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe"
          if ($installers.Count -eq 0) { throw "no NSIS installer was produced" }
          $installers | ForEach-Object { Write-Host "built: $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: acute-installer-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # ROUND-100 (R100-B): the Linux bundles — deb + AppImage on ubuntu-latest
  # (the documented-supported AppImage build system; WebKitGTK 4.1 is in
  # 24.04's apt). Mirrors desktop-installer step-for-step: pinned pnpm/node
  # → rust → workspace build → ADR-0009 sidecar staging (linux-x64 prebuilds)
  # → the pinned Linux Node runtime → the R57-style pre-pack boot gate
  # (bash port) → tauri build with --bundles deb,appimage → artifact upload.
  linux-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # PINNED to the SAME version as the Windows job above — the shipped
      # runtime IS the tested one on BOTH platforms, and the two must never
      # drift. Bump deliberately, together with SIDECAR_NODE_VERSION below
      # AND the Windows job's copy.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 prerequisites (v2.tauri.app/start/prerequisites): the
      # WebKitGTK 4.1 line (4.0 is gone from Ubuntu 24.04's repos — build
      # on ubuntu-latest/24.04) + the bundler's system libs.
      - name: Install WebKitGTK + bundle deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm version:check

      # Same contract as the Windows job: the workspace build runs BEFORE
      # staging (stage-sidecar.mjs copies agent-core/dist + shared/dist);
      # `pnpm tauri build` below re-runs `pnpm build` via beforeBuildCommand
      # — idempotent, same commit, same output.
      - name: Build the workspace (shared + agent-core + vite)
        run: pnpm build

      # ADR-0009 sidecar staging: pruned node_modules, exact lockfile
      # versions, vendored `shared` with a runnable package.json. Native
      # addons on Linux (R101-E truth, verified in the tarballs):
      # better-sqlite3 ships `linux-x64.node` prebuilds (loaded directly,
      # no install script), while node-pty ships NO Linux prebuilds at all
      # (its prebuilds/ holds darwin + win32 only) — it BUILDS FROM SOURCE
      # during the staging install (the generated pnpm-workspace.yaml
      # allowBuilds + the build-essential in the apt list above), which is
      # also why this job cannot be cross-compiled from another arch.
      - name: Stage the sidecar bundle
        run: node scripts/release/stage-sidecar.mjs --platform linux-x64

      # The pinned Linux Node runtime (the SAME version the Windows job
      # ships as node.exe — 31.8 MB tarball, HEAD-verified in research §C.3)
      # + its license texts for the bundle's LICENSES/ dir (SPEC §6 /
      # ADR-0009: the RUNTIME's compliance vehicle is shipping its notices
      # inside the installer). The binary lands as `sidecar/node` — the
      # sidecar.rs resolve order (node.exe, then node) picks it up.
      - name: Bundle the pinned Node runtime + licenses
        env:
          # Must match setup-node above — the shipped runtime IS the tested one.
          SIDECAR_NODE_VERSION: 24.20.0
        run: |
          set -euo pipefail
          ver="$SIDECAR_NODE_VERSION"
          tarball="node-v${ver}-linux-x64.tar.xz"
          curl -fSL -o "$tarball" "https://nodejs.org/dist/v${ver}/${tarball}"
          rm -rf /tmp/node-extract && mkdir -p /tmp/node-extract
          tar -xJf "$tarball" -C /tmp/node-extract
          extract="/tmp/node-extract/node-v${ver}-linux-x64"
          sidecar="src-tauri/staging/sidecar"
          # install (not cp) pins the exec bit — the gate below runs it and
          # the bundler preserves resource modes.
          install -m 755 "$extract/bin/node" "$sidecar/node"
          mkdir -p "$sidecar/LICENSES"
          cp "$extract/LICENSE" "$sidecar/LICENSES/node-v${ver}-LICENSE.txt"
          # v24 ships one combined LICENSE (older releases split a separate
          # ThirdPartyNotices.md — copy it too when present, future-proof).
          if [ -f "$extract/ThirdPartyNotices.md" ]; then
            cp "$extract/ThirdPartyNotices.md" "$sidecar/LICENSES/node-v${ver}-ThirdPartyNotices.md"
          fi
          ls -la "$sidecar"
          test -x "$sidecar/node" || { echo "::error::$sidecar/node was not staged"; exit 1; }

      # ROUND-100 — THE LINUX PRE-PACK BOOT GATE (the R57 Windows gate,
      # ported to bash): the staged engine must actually BOOT on Linux
      # before it is packed — the REAL pinned `node` binary against the
      # staged app with the same env the Rust shell passes (ACUTE_TOKEN /
      # ACUTE_DB_PATH, cwd = the app dir), polling for the ACUTE_READY
      # handshake line. This is also the proof the staged native addons
      # load on this platform — better-sqlite3's `linux-x64` prebuild is on
      # the boot path (SQL migrations run before ACUTE_READY) — the exact
      # class of failure the Windows gate exists for. A failed boot prints the
      # engine's stdout/stderr tails and fails the build BEFORE
      # `pnpm tauri build` can pack a dead engine.
      - name: Boot the staged engine on Linux (pre-pack gate)
        env:
          ACUTE_BOOT_TIMEOUT_S: "90"
        run: |
          set -euo pipefail
          # ALL paths ABSOLUTE (the R57 lesson): no dependence on the
          # working directory beyond the deliberate cd below.
          sidecar="$PWD/src-tauri/staging/sidecar"
          out="/tmp/acute-boot-stdout.log"
          err="/tmp/acute-boot-stderr.log"
          db="/tmp/acute-boot-test.db"
          rm -f "$out" "$err" "$db"
          export ACUTE_TOKEN="ci-boot-token"
          export ACUTE_DB_PATH="$db"
          # cwd = the app dir (the Windows gate's -WorkingDirectory): the
          # engine's default log file lands at <cwd>/.dev/acute.log and
          # migrations resolve via import.meta.url regardless.
          cd "$sidecar/app"
          "$sidecar/node" "$sidecar/app/dist/main.js" >"$out" 2>"$err" &
          pid=$!
          ready=0
          deadline=$(( $(date +%s) + ACUTE_BOOT_TIMEOUT_S ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if grep -q "ACUTE_READY" "$out" 2>/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -eq 1 ]; then
            echo "R100 boot gate: staged engine is UP on Linux — $(grep ACUTE_READY "$out" | head -1)"
          else
            echo "::error::R100 boot gate: staged engine did not report ACUTE_READY within ${ACUTE_BOOT_TIMEOUT_S}s. NEVER pack this tree — this is the 'Can't reach agent-core' failure mode."
            if [ -f "$out" ]; then echo "--- engine stdout tail ---"; tail -40 "$out"; fi
            if [ -f "$err" ]; then echo "--- engine stderr tail ---"; tail -40 "$err"; fi
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          # Tree-kill (taskkill /T /F's mirror): the engine may hold sqlite
          # + children; kill the children first, then the engine, a
          # bounded wait, SIGKILL last — a leaked node would hold the temp
          # DB and slow every later retry.
          pkill -TERM -P "$pid" 2>/dev/null || true
          kill -TERM "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.25
          done
          kill -KILL "$pid" 2>/dev/null || true
          rm -f "$out" "$err" "$db"

      # deb + AppImage ONLY. rpm is deliberately OUT despite research
      # §C.1's "+rpm if cheap": it is not cheap — the tauri-bundler rpm
      # backend hangs indefinitely in CI on current versions (tauri issue
      # #15698, reproduced with `--bundles deb,rpm` alone on
      # ubuntu-latest/24.04 and 22.04; tauri 2.11.4 / tauri-bundler 2.9.4 —
      # the exact versions this repo's `tauri = "2"` resolves). Revisit
      # when the issue closes. AppImage itself is documented "only fully
      # supported on Ubuntu build systems" — ubuntu-latest qualifies.
      - name: Build the Linux bundles
        run: pnpm tauri build --bundles deb,appimage

      # Bundler contract (tauri-bundler 2.x linux): files are
      # <productName>_<version>_<arch>.deb / .AppImage →
      # ACUTE-CODE_<v>_amd64.{deb,AppImage} on x86_64.
      - name: Verify + collect the bundles
        run: |
          set -euo pipefail
          debs="$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null || true)"
          appimages="$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null || true)"
          if [ -z "$debs" ] || [ -z "$appimages" ]; then
            echo "::error::expected a .deb and an .AppImage — got:"
            ls -R src-tauri/target/release/bundle 2>/dev/null || true
            exit 1
          fi
          for f in $debs $appimages; do
            echo "built: $f ($(du -h "$f" | cut -f1))"
          done
          # R100 hotfix 4: upload-artifact@v4 derives paths from the LEAST
          # COMMON ANCESTOR of every matched file — two globs spanning deb/
          # and appimage/ store them as deb/… + appimage/… subdirs, and the
          # github-release job then can't find the flat names its verify
          # step + files glob expect. Copy into ONE flat dir first: a single
          # glob uploads bare filenames, the download lands them flat in
          # linux-bundles/, and every downstream check matches.
          mkdir -p bundle-flat
          cp $debs $appimages bundle-flat/

      - name: Upload Linux bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: acute-bundles-linux
          path: bundle-flat/*
          if-no-files-found: error

  # ROUND-101 (R101-E): the Linux ARM64 (aarch64) bundles — deb + AppImage on
  # ubuntu-24.04-arm, GitHub's NATIVE ARM64 runner. A copy of `linux-bundles`
  # above with only the arch swapped. NATIVE, not cross: node-pty ships
  # prebuilds only for darwin/win32 — on Linux it compiles from source for
  # the HOST arch — so an x64 runner with `--target aarch64` would link an
  # x86_64 pty.node into an arm64 bundle; natively, every step of the x64
  # recipe (WebKitGTK apt, rust, the source-built node-pty, the boot gate,
  # deb + AppImage bundling) runs unmodified. better-sqlite3 ships a
  # `linux-arm64.node` prebuild (verified in the tarball), so it still needs
  # no toolchain. COST: the repo is private → ARM runner minutes are billed;
  # acceptable because this workflow fires only on manual dispatch + v*
  # tags, never per-push (rust-checks.yml's `rust-linux-arm64` is the
  # per-push gate since ROUND-122 — path-gated on src-tauri/**).
  linux-bundles-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # PINNED to the SAME version as the Windows + x64-Linux jobs above —
      # the shipped runtime IS the tested one on EVERY platform, and the
      # three must never drift. Bump deliberately, together with
      # SIDECAR_NODE_VERSION below AND the other jobs' copies.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same Tauri v2 prerequisites as the x64 job, byte-identical: every
      # package here is published for arm64 in Ubuntu 24.04's repos
      # (WebKitGTK 4.1 included). build-essential is load-bearing — see the
      # staging step below.
      - name: Install WebKitGTK + bundle deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm version:check

      # Same contract as the Windows + x64-Linux jobs: the workspace build
      # runs BEFORE staging (stage-sidecar.mjs copies agent-core/dist +
      # shared/dist); `pnpm tauri build` below re-runs `pnpm build` via
      # beforeBuildCommand — idempotent, same commit, same output.
      - name: Build the workspace (shared + agent-core + vite)
        run: pnpm build

      # ADR-0009 sidecar staging, arch-swapped: better-sqlite3 keeps only
      # its `linux-arm64.node` prebuild (verified shipped); node-pty has NO
      # Linux prebuilds (darwin/win32 only) and its install script compiles
      # pty.node from source for the HOST arch — arm64 here, which is the
      # whole reason this job runs natively (see the job comment above).
      - name: Stage the sidecar bundle
        run: node scripts/release/stage-sidecar.mjs --platform linux-arm64

      # The pinned Linux ARM64 Node runtime (the SAME version the Windows
      # and x64-Linux jobs ship — 30.8 MB tarball, nodejs.org/dist
      # HEAD-verified R101-E) + its license texts for the bundle's LICENSES/
      # dir (SPEC §6 / ADR-0009: the RUNTIME's compliance vehicle is
      # shipping its notices inside the installer). The binary lands as
      # `sidecar/node` — the sidecar.rs resolve order (node.exe, then node)
      # picks it up.
      - name: Bundle the pinned Node runtime + licenses
        env:
          # Must match setup-node above — the shipped runtime IS the tested one.
          SIDECAR_NODE_VERSION: 24.20.0
        run: |
          set -euo pipefail
          ver="$SIDECAR_NODE_VERSION"
          tarball="node-v${ver}-linux-arm64.tar.xz"
          curl -fSL -o "$tarball" "https://nodejs.org/dist/v${ver}/${tarball}"
          rm -rf /tmp/node-extract && mkdir -p /tmp/node-extract
          tar -xJf "$tarball" -C /tmp/node-extract
          extract="/tmp/node-extract/node-v${ver}-linux-arm64"
          sidecar="src-tauri/staging/sidecar"
          # install (not cp) pins the exec bit — the gate below runs it and
          # the bundler preserves resource modes.
          install -m 755 "$extract/bin/node" "$sidecar/node"
          mkdir -p "$sidecar/LICENSES"
          cp "$extract/LICENSE" "$sidecar/LICENSES/node-v${ver}-LICENSE.txt"
          # v24 ships one combined LICENSE (older releases split a separate
          # ThirdPartyNotices.md — copy it too when present, future-proof).
          if [ -f "$extract/ThirdPartyNotices.md" ]; then
            cp "$extract/ThirdPartyNotices.md" "$sidecar/LICENSES/node-v${ver}-ThirdPartyNotices.md"
          fi
          ls -la "$sidecar"
          test -x "$sidecar/node" || { echo "::error::$sidecar/node was not staged"; exit 1; }

      # ROUND-101 — THE ARM64 PRE-PACK BOOT GATE (the R100 bash gate copied
      # verbatim; it runs natively on ARM): the staged engine must actually
      # BOOT before it is packed — the REAL pinned `node` binary against
      # the staged app with the same env the Rust shell passes (ACUTE_TOKEN
      # / ACUTE_DB_PATH, cwd = the app dir), polling for the ACUTE_READY
      # handshake line. This is also the proof the staged native addons load
      # on aarch64 — better-sqlite3's `linux-arm64` prebuild is on the boot
      # path (SQL migrations run before ACUTE_READY). A failed boot prints
      # the engine's stdout/stderr tails and fails the build BEFORE
      # `pnpm tauri build` can pack a dead engine.
      - name: Boot the staged engine on Linux ARM64 (pre-pack gate)
        env:
          ACUTE_BOOT_TIMEOUT_S: "90"
        run: |
          set -euo pipefail
          # ALL paths ABSOLUTE (the R57 lesson): no dependence on the
          # working directory beyond the deliberate cd below.
          sidecar="$PWD/src-tauri/staging/sidecar"
          out="/tmp/acute-boot-stdout.log"
          err="/tmp/acute-boot-stderr.log"
          db="/tmp/acute-boot-test.db"
          rm -f "$out" "$err" "$db"
          export ACUTE_TOKEN="ci-boot-token"
          export ACUTE_DB_PATH="$db"
          # cwd = the app dir (the Windows gate's -WorkingDirectory): the
          # engine's default log file lands at <cwd>/.dev/acute.log and
          # migrations resolve via import.meta.url regardless.
          cd "$sidecar/app"
          "$sidecar/node" "$sidecar/app/dist/main.js" >"$out" 2>"$err" &
          pid=$!
          ready=0
          deadline=$(( $(date +%s) + ACUTE_BOOT_TIMEOUT_S ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if grep -q "ACUTE_READY" "$out" 2>/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -eq 1 ]; then
            echo "R101 boot gate: staged engine is UP on Linux ARM64 — $(grep ACUTE_READY "$out" | head -1)"
          else
            echo "::error::R101 boot gate: staged engine did not report ACUTE_READY within ${ACUTE_BOOT_TIMEOUT_S}s. NEVER pack this tree — this is the 'Can't reach agent-core' failure mode."
            if [ -f "$out" ]; then echo "--- engine stdout tail ---"; tail -40 "$out"; fi
            if [ -f "$err" ]; then echo "--- engine stderr tail ---"; tail -40 "$err"; fi
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          # Tree-kill (taskkill /T /F's mirror): the engine may hold sqlite
          # + children; kill the children first, then the engine, a
          # bounded wait, SIGKILL last — a leaked node would hold the temp
          # DB and slow every later retry.
          pkill -TERM -P "$pid" 2>/dev/null || true
          kill -TERM "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.25
          done
          kill -KILL "$pid" 2>/dev/null || true
          rm -f "$out" "$err" "$db"

      # deb + AppImage ONLY, same exclusion as the x64 job (rpm OUT on the
      # tauri #15698 CI-hang evidence; AppImage is documented "only fully
      # supported on Ubuntu build systems" — ubuntu-24.04-arm qualifies).
      - name: Build the Linux bundles
        run: pnpm tauri build --bundles deb,appimage

      # Bundler contract (tauri-bundler 2.x linux) — PROVEN ON THE FIRST
      # v0.99.0 RUN (the R101 hotfix): the two formats name the arch
      # differently on aarch64. The deb uses dpkg's arch name
      # (`_arm64`); the AppImage uses the Rust triple's arch name
      # (`_aarch64`). That asymmetry IS the Linux convention (Debian vs
      # kernel/Rust naming) — the exact version-stamped names are asserted
      # (not just "some .deb exists") so a wrong-arch or wrong-version
      # artifact fails LOUDLY here, before the release job.
      - name: Verify + collect the bundles
        run: |
          set -euo pipefail
          ver="$(node scripts/release/version.mjs get)"
          deb="src-tauri/target/release/bundle/deb/ACUTE-CODE_${ver}_arm64.deb"
          appimage="src-tauri/target/release/bundle/appimage/ACUTE-CODE_${ver}_aarch64.AppImage"
          if [ ! -f "$deb" ] || [ ! -f "$appimage" ]; then
            echo "::error::expected ACUTE-CODE_${ver}_arm64.deb + ACUTE-CODE_${ver}_aarch64.AppImage — got:"
            ls -R src-tauri/target/release/bundle 2>/dev/null || true
            exit 1
          fi
          echo "built: $deb ($(du -h "$deb" | cut -f1))"
          echo "built: $appimage ($(du -h "$appimage" | cut -f1))"
          # R100 hotfix 4 (same as the x64 job): upload-artifact@v4 derives
          # paths from the LEAST COMMON ANCESTOR of every matched file —
          # copy into ONE flat dir first: a single glob uploads bare
          # filenames, the download lands them flat in
          # linux-bundles-arm64/, and every downstream check matches.
          mkdir -p bundle-flat
          cp "$deb" "$appimage" bundle-flat/

      - name: Upload Linux ARM64 bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: acute-bundles-linux-arm64
          path: bundle-flat/*
          if-no-files-found: error

  # Draft release ONLY on tag pushes — the owner reviews + publishes manually.
  github-release:
    needs: [launcher-kit, desktop-installer, linux-bundles, linux-bundles-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # ROUND-103 (the release-pipeline hardening): bounded like its siblings.
    # The v0.100.0 tag run (35243431119) hung 27+ minutes in the old
    # softprops uploader with NO timeout until manual cancellation; this
    # backstop now caps the whole job. 30 (not 25): the uploader's
    # backoff ladder (30/60/120s) + landed-check polls deliberately ride
    # out uploads.github.com's intermittent 500 window (~5–10 min, seen
    # live on the v0.100.0 dispatch) — bounded-and-slower beats hung, and
    # a re-run resumes from the banked assets anyway.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: acute-launcher-kit-v${{ needs.launcher-kit.outputs.version }}

      - name: Download the Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: acute-installer-windows-x64
          path: installer

      # ROUND-100 (R100-B): the Linux bundles join the same draft release.
      - name: Download the Linux bundles artifact
        uses: actions/download-artifact@v4
        with:
          name: acute-bundles-linux
          path: linux-bundles

      # ROUND-101 (R101-E): the ARM64 Linux bundles join the same draft
      # release (kept in a DISTINCT dir — the tag-verify + files globs
      # below address each arch by name).
      - name: Download the Linux ARM64 bundles artifact
        uses: actions/download-artifact@v4
        with:
          name: acute-bundles-linux-arm64
          path: linux-bundles-arm64

      - name: Verify the tag matches the released version
        run: |
          if [ "${{ github.ref_name }}" != "v${{ needs.launcher-kit.outputs.version }}" ]; then
            echo "::error::tag '${{ github.ref_name }}' does not match the repo version '${{ needs.launcher-kit.outputs.version }}' — run 'pnpm version:set <version>' and re-tag"
            exit 1
          fi
          # The installer exe embeds the same version in its name (bundler
          # contract) — a mismatch means the two jobs built different commits.
          if ! ls "installer/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_x64-setup.exe" >/dev/null 2>&1; then
            echo "::error::expected installer/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_x64-setup.exe — got: $(ls installer/)"
            exit 1
          fi
          # Same guard for the Linux bundles (bundler contract:
          # <productName>_<version>_<arch>.deb/.AppImage → _amd64).
          if ! ls "linux-bundles/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_amd64.deb" >/dev/null 2>&1 \
            || ! ls "linux-bundles/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_amd64.AppImage" >/dev/null 2>&1; then
            echo "::error::expected linux-bundles/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_amd64.{deb,AppImage} — got: $(ls linux-bundles/)"
            exit 1
          fi
          # And the ARM64 bundles (R101-E; the PROVEN first-run naming:
          # the deb carries dpkg's `_arm64`, the AppImage carries the Rust
          # triple's `_aarch64` — the R101 hotfix corrected the expectation).
          if ! ls "linux-bundles-arm64/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_arm64.deb" >/dev/null 2>&1 \
            || ! ls "linux-bundles-arm64/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_aarch64.AppImage" >/dev/null 2>&1; then
            echo "::error::expected linux-bundles-arm64/ACUTE-CODE_${{ needs.launcher-kit.outputs.version }}_arm64.deb + _aarch64.AppImage — got: $(ls linux-bundles-arm64/)"
            exit 1
          fi

      # ROUND-103 (the release-pipeline hardening): the softprops action is
      # GONE. Its concurrent uploader hung three times on the 135 MB
      # amd64.AppImage during the v0.100.0 tag run (35243431119) — two
      # "Headers Timeout Error" deaths and a 27-minute silent stall that
      # needed manual cancellation — because it configures NO client-side
      # upload timeout, and every re-run deleted the five already-uploaded
      # assets before re-sending everything (non-idempotent: one flaky
      # asset became a multi-hour stall with a half-emptied draft).
      # The replacement is scripts/release/publish-github-release.sh:
      # BOUNDED (per-call timeouts + a stalled-transfer detector), RETRYING
      # (per-asset curl retries), and RESUMABLE (same-name-same-size assets
      # are skipped, so re-running the job re-sends only what is missing).
      # Proven end-to-end against the live API in four rig passes during
      # the round (fresh upload / pure resume / stale replace / re-tag
      # dedupe) — see docs/ui-iterations/round-103.md §2.
      - name: Create draft GitHub release (bounded, retrying, resumable)
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.launcher-kit.outputs.version }}
        run: bash scripts/release/publish-github-release.sh
