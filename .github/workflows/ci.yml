name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@11.22.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm version:check

      # R74: the launcher's release-picker unit tests — the drafts-first
      # API-order freeze (owner stuck on 0.67.0 while 0.73.0 was live)
      # must never regress.
      - name: Launcher unit tests
        run: python launcher/tests/test_pick_latest_release.py

      - name: Docs check (freshness + drift — round 28 WS-J1)
        run: pnpm docs:check
        continue-on-error: true  # warn-only for now (existing docs need stamp backfill)

      - name: Verify (lint, typecheck, test, build, license audit)
        run: pnpm verify

      - name: Type-check the Rust shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
