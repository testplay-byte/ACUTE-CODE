name: CI

on:
  push:
    # ROUND-122 (R122-W3): byte-verified — this filter reads `branches:
    # [main]` and always has (first commit 6d200e2, blob c559bd0). The
    # long-suspected "branches: ain] YAML rot" is the sandbox DISPLAY
    # artifact on record since R43 (ORCHESTRATION-WORKLOG: "[m-sequence
    # stripping … NO yaml edits; byte-verified"; R97's '[hoverSeg' phantom
    # is the same class) — a terminal that eats the "[m" of "[main]" and
    # renders "ain]". No fix was ever needed; R122 re-verified at the byte
    # level and leaves this note so the phantom cannot fool another round.
    branches: [main]
    # ROUND-122 (R122-W3): skip the full verify sweep when ONLY docs changed
    # (the owner's r110-feedback #8: "Consider path filters on CI (skip full
    # verify when only docs/ changed)"). Honest accounting: docs:check in
    # this CI is continue-on-error warn-only, so no enforcement is lost; a
    # non-docs push still sweeps the whole docs tree, so drift introduced
    # by a docs-only commit is caught on the next code push.
    # `.github/workflows/**` is deliberately NOT ignored — workflow edits
    # must be validated by CI.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "shots/**"
  pull_request:
    # ROUND-122: the same docs-only skip on the PR leg.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "shots/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    # ROUND-103: bounded jobs everywhere — a wedged job fails visibly in
    # minutes instead of hanging for hours (the release-pipeline lesson).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@11.22.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm version:check

      # R74 + R90-B1: the launcher's unit tests — the R74 drafts-first
      # API-order freeze (owner stuck on 0.67.0 while 0.73.0 was live) and
      # the R90-B1 GitHub-token path/migration contract. Discovery runs every
      # launcher/tests/test_*.py file (the run command each suite's
      # docstring advertises).
      - name: Launcher unit tests
        run: python -m unittest discover -s launcher/tests -v

      - name: Docs check (freshness + drift — round 28 WS-J1)
        run: pnpm docs:check
        continue-on-error: true  # warn-only for now (existing docs need stamp backfill)

      # R100-C: the design-language audit gate rides the verify chain right
      # after the test step (same place license:audit runs — end of verify),
      # so CI fails on design-token regressions without a second pass over
      # the tree. Baseline ratchet: scripts/design-audit-baseline.json.
      - name: Verify (lint, typecheck, test, design audit, build, license audit)
        run: pnpm verify

      - name: Type-check the Rust shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # ROUND-122 (R122-W3): the `rust-linux` and `rust-linux-arm64` jobs moved
  # OUT of this file into .github/workflows/rust-checks.yml — the R122
  # Actions-economy move (the owner's r110-feedback #8): they now run only
  # when src-tauri/** (or their own workflow file) changes, instead of on
  # every push. The R101-E cost note that rode the ARM64 job anticipated
  # exactly this: "If it ever hurts, gate it behind a paths filter
  # (src-tauri/**) or dispatch-only — the release workflow's
  # `linux-bundles-arm64` job remains the hard gate either way." The
  # Windows-side `cargo check` still runs in the verify job above on every
  # non-docs push, so a src-tauri change remains compile-gated on Windows
  # too. The full job bodies (provenance comments intact) live on in
  # rust-checks.yml.
