[package]
name = "acute-code"
version = "0.1.0"
description = "ACUTE-CODE desktop shell (Tauri 2)"
license = "LicenseRef-Proprietary"
edition = "2021"

[lib]
name = "acute_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ROUND-50 (R50-a): the "unstable" feature unlocks Tauri 2's multiwebview API
# surface — `Window::add_child`, `tauri::WebviewBuilder` and the
# `Manager::get_webview`/`Manager::webviews` getters are all feature-gated
# (`#[cfg(any(test, all(desktop, feature = "unstable")))]` in tauri 2.11.5).
# The native embedded browser (child webviews over the BrowserPanel) cannot
# compile without it. "unstable" is Tauri's name for the multiwebview preview
# — the APIs themselves ship in the stable 2.x runtime.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
# ROUND-98 (R98-J, owner: task complete / failed / permission needed → the
# user's PC): the OS-notification plugin. NO npm package — the frontend
# bridge (src/lib/desktop-notifications.ts) rides the withGlobalTauri
# window.__TAURI__.core.invoke channel and calls the plugin's raw IPC
# surface EXACTLY:
#   · plugin:notification|notify            { options: { title, body } }
#     (the Rust command's parameter is `options: NotificationData`;
#     NotificationData is #[serde(rename_all = "camelCase")], so its two
#     fields ride as title/body inside the `options` wrapper — the wrapper
#     key matches the Rust param name)
#   · plugin:notification|is_permission_granted  → boolean | null
#     (null = not yet determined — the "default" state)
#   · plugin:notification|request_permission     → PermissionState
#     ("granted" / "denied" / "default" / "prompt" — camelCase-renamed
#     enum variants)
# NOTE: plugin versions >= 2.3 ALSO inject a window.Notification POLYFILL
# into every webview — the app's legacy in-page Notification path
# (Toaster.tsx) is therefore guarded web-only so the two paths never
# double-fire a record.
tauri-plugin-notification = "2"

# ROUND-55 (R55): direct CredReadW/CredWriteW FFI with exact TargetName
# control — the keyring crate was dropped because its Windows TargetName is
# derived as `{user}.{service}` (`api-key.ACUTE-CODE/provider/<id>`), which
# can never match the launcher's cmdkey targets
# (`ACUTE-CODE/provider/<id>`). See src/wincred.rs for the post-mortem.
#
# ROUND-94 (R94-B): the sidecar child's kill-on-close leash (src/sidecar.rs
# `sidecar_job` — CreateJobObjectW / SetInformationJobObject /
# AssignProcessToJobObject) so a taskkill'd/crashed app can never orphan a
# file-locking node.exe (the owner's installer report). Feature notes:
# "Win32_System_JobObjects" is the module itself, "Win32_System_Threading"
# carries the JOBOBJECT_EXTENDED_LIMIT_INFORMATION struct (its IoInfo field
# is Threading::IO_COUNTERS), and "Win32_Security" gates CreateJobObjectW's
# SECURITY_ATTRIBUTES parameter (already implied by
# Win32_Security_Credentials — listed for explicitness).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# ROUND-100 (R100-B, ADR-0031): the Linux key store — the freedesktop Secret
# Service (gnome-keyring/KWallet, encrypted at rest by the desktop keyring
# daemon) via the keyring crate, target-gated exactly like windows-sys above
# so the Windows build is untouched. keyring 3.x has NO default features —
# `sync-secret-service` is the crate README's documented Linux combo.
# ROUND-102 correction (live-verified): the sync backend rides the C libdbus
# (`dbus-secret-service` → `libdbus-sys`, needs libdbus-1-dev + pkg-config
# to build — present on the CI runners), NOT zbus — and its D-Bus
# round-trips block without a deadline, which is why wincred.rs now bounds
# every Entry op at 20s on its own thread (the owner's frozen-app report;
# ADR-0031's round-102 addendum). Deliberately NOT `linux-native*` (kernel
# keyutils — not persistent across reboots, not the desktop keyring daemon's
# encrypted store). The R55 reason for dropping keyring on Windows (its
# `{user}.{service}` TargetName vs cmdkey) does not exist on Linux — nothing
# seeds keys there. See docs/decisions/0031-linux-key-store.md.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
