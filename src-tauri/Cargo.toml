[package]
name = "acute-code"
version = "0.1.0"
description = "ACUTE-CODE desktop shell (Tauri 2)"
license = "LicenseRef-Proprietary"
edition = "2021"

[lib]
name = "acute_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
