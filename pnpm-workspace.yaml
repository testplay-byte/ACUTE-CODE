# The workspace root (this directory) is the frontend package itself, so only
# the sidecar and the shared types package are listed here (brief section 5).
packages:
  - agent-core
  - shared

# pnpm 11 blocks dependency build scripts unless explicitly allowed; esbuild
# (used by vite/vitest), better-sqlite3 (native addon prebuild/fallback build,
# ADR-0007) and node-pty (ROUND-45 R45-b native PTY — optionalDependency, the
# sidecar falls back to the persistent-pipe shell engine when it cannot build)
# are the dependencies that need one.
allowBuilds:
  esbuild: true
  better-sqlite3: true
  node-pty: true
